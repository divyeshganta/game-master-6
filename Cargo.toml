[package]
name = "GameMaster6"
version = "1.6.1"
edition = "2021"
description = "Hardware-adaptive Windows GUI launcher, multi-runner manager, VRAM-tier preset tuner, and live RAM/commit diagnostics for compatibility runners."

[[bin]]
name = "GameMaster6"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
